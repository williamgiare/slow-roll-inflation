  + P*T**2*s0*s1/3 - P*T**2*s2/6 + P*T*s0*s2/6 + P*T*s1**2/6 + 15*T**5*Z/2 + 13*T**5/4
  - 17*T**4*Z*s0 - 17*T**4*s0/4 + 23*T**3*Z*s0**2/2 - 23*T**3*Z*s1/4 + T**3*s0**2
  - 3*T**3*s1/2 - 2*T**2*Z*s0**3 + 5*T**2*Z*s0*s1 - T**2*Z*s2 - T**2*s0*s1/2 - T**2*s2/2
  + 3*T*Z*s0**2*s1/4 + T*Z*s0*s2 + T*Z*s1**2 - T*s0**2*s1 - 2*T*s0*s2 - 2*T*s1**2
