#========
# WG Edit
# Package SRI with a source layout and a single public command.
#========
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slow-roll-inflation"
dynamic = ["version"]
description = "Slow-roll spectra and scalar–tensor consistency relations with reproducible validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "numpy>=1.24", "scipy>=1.11", "mpmath>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
validation = ["numpy>=1.24", "scipy>=1.11", "mpmath>=1.3", "pytest>=8"]
# WG Edit: optional dependencies for the readable validation entry points.
notebooks = ["matplotlib>=3.8", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6", "pytest>=8"]

[project.scripts]
SRI = "sri.cli:main"

# WG Edit: map the public sri package directly to source/.
[tool.setuptools]
packages = ["sri", "sri.iterative", "sri.closed", "sri.analytic"]
package-dir = {sri = "source"}

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
